<div class="cart">
    <div class="card">
        <p-table [value]="cartStore.netCartList()" [scrollable]="true" scrollHeight="530px"
            [tableStyle]="{'min-width': '50rem'}" tableStyleClass="custom-row-height">
            <ng-template pTemplate="header">
                <tr>
                    <th>Sno</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
                <tr>
                    <td>{{ rowIndex + 1 }}</td>
                    <td>{{item.name}}</td>
                    <td>{{item.unitPrice | number: '1.2-2'}}</td>
                    <td>{{item.qty}}</td>
                    <td>{{item.amount | number: '1.2-2'}}</td>
                    <td>
                        <button type="button" class="mr-2" severity="success" pButton pRipple icon="pi pi-pencil"
                            (click)="editProduct(item)">
                        </button>

                        <button type="button" severity="danger" pButton pRipple icon="pi pi-trash"
                            (click)="deleteProduct(item)">
                        </button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>



<p-dialog [(visible)]="itemDialog" [style]="{ width: '450px' }" header="Product Details" [modal]="true"
    styleClass="p-fluid">
    <ng-template pTemplate="content">
        <div class="formgrid grid">
            <div class="field col">
                <label for="name">Product Name</label>
                <input [disabled]="true" type="text" pInputText id="name" [(ngModel)]="item.name" required autofocus />
            </div>
            <div class="field col">
                <label for="quantity">Quantity</label>
                <p-inputNumber id="quantity" [(ngModel)]="item.qty" />
            </div>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" icon="pi pi-times" [text]="true" (onClick)="hideDialog()" />
        <p-button label="Save" icon="pi pi-check" [text]="true" (onClick)="saveProduct()" />
    </ng-template>
</p-dialog>
