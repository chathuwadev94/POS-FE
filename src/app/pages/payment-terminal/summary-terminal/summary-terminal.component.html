<div class="grid nested-grid">
    <div class="col-12">
        <div class="grid">

            <div class="col-12 md:col-6 lg:col-6">
                <p-card class="summary-transparent-card">
                    <div class="flex flex-row" style="height: 80px;">
                        <div class="flex flex-column">
                            <div>
                                <h2 class="summary-lbl">Total Items : </h2>
                            </div>
                            <div>
                                <h2 class="summary-lbl">Total Quantity :</h2>
                            </div>
                        </div>
                        <div class="flex flex-column">
                            <div>
                                <h2 class="summary-lbl flex justify-content-center">{{cartStore.totalItemCount()}}</h2>
                            </div>
                            <div>
                                <h2 class="summary-lbl">{{cartStore.totalQuantity()}}</h2>
                            </div>
                        </div>
                    </div>
                </p-card>

            </div>
            <div class="col-12 md:col-6 lg:col-6">
                <p-card class="summary-transparent-card">
                    <div class="flex flex-row" style="height: 80px;">
                        <div class="flex flex-column">
                            <div>
                                <h2 class="summary-lbl">Gross Amount :</h2>
                            </div>
                            <div>
                                <h2 class="summary-lbl">Total Discount :</h2>
                            </div>
                        </div>
                        <div class="flex flex-column">
                            <div>
                                <h2 class="summary-lbl">{{cartStore.netAmmount() | number: '1.2-2'}}</h2>
                            </div>
                            <div>
                                <h2 class="summary-lbl">{{0 | number: '1.2-2'}}</h2>
                            </div>
                        </div>
                    </div>
                </p-card>

            </div>
            <div class="col-12 md:col-12 lg:col-12">
                <p-card class="summary-transparent-card">
                    <div class="flex justify-content-center flex-wrap">
                        <h1 class="n-ammount-lbl">Net Amount :
                            <span class="amount-lbl">{{cartStore.netAmmount() | number: '1.2-2'}} LKR</span>
                        </h1>
                    </div>
                </p-card>
            </div>
        </div>
    </div>
</div>
